<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Mau, Full Stack Developer">
  <title>Mau — Full Stack Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A12"/>
      <stop offset="0.5" stop-color="#071427"/>
      <stop offset="1" stop-color="#04070E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.45" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="26s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1D4ED8" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .blink { animation: blink 1.15s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .scan { animation: scan 7.5s linear infinite; }
      @keyframes scan { 0% { transform: translateY(0) } 100% { transform: translateY(196px) } }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .22 } 50% { opacity: .8 } }
      .drift { animation: drift 9s ease-in-out infinite; }
      @keyframes drift { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <ellipse cx="150" cy="20" rx="330" ry="210" fill="#0EA5E9" opacity="0.20" filter="url(#soft)"/>
  <ellipse cx="1080" cy="350" rx="320" ry="200" fill="#4F46E5" opacity="0.18" filter="url(#soft)"/>

  <text x="72" y="116" class="mono" font-size="14" fill="#38BDF8" letter-spacing="5">// HOLA, SOY</text>

  <text x="68" y="222" class="sans" font-size="116" font-weight="800" fill="url(#accent)" letter-spacing="2">MAU</text>

  <rect x="74" y="240" width="168" height="5" rx="2.5" fill="url(#fade)"/>
  <rect x="342" y="142" width="9" height="76" rx="4" fill="#22D3EE" class="blink"/>

  <text x="74" y="286" class="sans" font-size="21" font-weight="600" fill="#E2E8F0" letter-spacing="7">FULL STACK DEV</text>
  <text x="74" y="316" class="mono" font-size="13.5" fill="#7C93B0">web · mobile · APIs · dashboards · CI/CD</text>

  <g>
    <rect x="74" y="334" width="120" height="26" rx="13" fill="#0B1730" stroke="#1E3A8A"/>
    <text x="134" y="351" class="mono" font-size="11.5" fill="#7DD3FC" text-anchor="middle">@Mau6987</text>
  </g>

  <g class="drift">
    <rect x="720" y="64" width="416" height="228" rx="14" fill="#08101E" fill-opacity="0.94" stroke="#1E3A8A"/>
    <rect x="720" y="64" width="416" height="36" rx="14" fill="#0B1730"/>
    <rect x="720" y="86" width="416" height="14" fill="#0B1730"/>
    <circle cx="742" cy="82" r="5" fill="#EF4444" opacity="0.85"/>
    <circle cx="760" cy="82" r="5" fill="#F59E0B" opacity="0.85"/>
    <circle cx="778" cy="82" r="5" fill="#22C55E" opacity="0.85"/>
    <text x="800" y="87" class="mono" font-size="12" fill="#64748B">mau@fullstack: ~</text>

    <g class="mono" font-size="13.5">
      <text x="744" y="132" fill="#4B6382"><tspan fill="#22D3EE">&#10148;</tspan> <tspan fill="#93C5FD">~</tspan> whoami</text>
      <text x="744" y="156" fill="#E2E8F0">desarrollador full stack</text>

      <text x="744" y="188" fill="#4B6382"><tspan fill="#22D3EE">&#10148;</tspan> <tspan fill="#93C5FD">~</tspan> stack</text>
      <text x="744" y="212" fill="#93C5FD">react · next · angular · node · nest</text>

      <text x="744" y="244" fill="#4B6382"><tspan fill="#22D3EE">&#10148;</tspan> <tspan fill="#93C5FD">~</tspan> status</text>
      <text x="744" y="268" fill="#E2E8F0">construyendo productos de punta a punta</text>
    </g>

    <rect x="744" y="277" width="9" height="14" fill="#22D3EE" class="blink"/>
    <rect x="720" y="100" width="416" height="2" fill="url(#fade)" opacity="0.55" class="scan"/>
  </g>

  <g class="pulse">
    <circle cx="1146" cy="318" r="3" fill="#38BDF8"/>
    <circle cx="1122" cy="336" r="2" fill="#22D3EE"/>
    <circle cx="1160" cy="344" r="2" fill="#6366F1"/>
  </g>

  <rect x="72" y="372" width="1056" height="2" fill="url(#fade)"/>
</svg>
