<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-label="aplicaciones web, apps móviles, APIs REST, dashboards, CI/CD">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .blink { animation: blink 1.15s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1200" height="72" fill="#060C16"/>
  <rect x="0" y="0" width="1200" height="1" fill="url(#bar)" opacity="0.6"/>

  <text x="48" y="44" class="mono" font-size="16" fill="#93C5FD"><tspan fill="#22D3EE">&gt; </tspan>aplicaciones web · apps móviles · APIs REST · dashboards · CI/CD</text>

  <rect x="640" y="28" width="9" height="20" fill="#22D3EE" class="blink"/>

  <rect x="-260" y="0" width="260" height="72" fill="url(#sweep)">
    <animate attributeName="x" values="-260;1460" dur="7s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="71" width="1200" height="1" fill="url(#bar)" opacity="0.6"/>
</svg>
